[project]
name = "lenia-vlm"
version = "0.1.0"
description = "Open-ended evolution of MaCE-Lenia worlds steered by a cheap decision model and a rare generative VLM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "google-genai>=2.33.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.2"]                   # `uv sync --extra gpu`; preinstalled on Colab

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lenia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
