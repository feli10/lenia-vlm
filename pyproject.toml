[project]
name = "lenia-vlm"
version = "0.1.0"
description = "Lenia creatures under a hard 'alive' constraint, with VLM aesthetic preferences on top"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.scripts]
lenia = "lenia.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lenia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
