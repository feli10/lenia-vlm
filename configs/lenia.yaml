# Defaults for `lenia`. Override with: lenia --config my.yaml <command> (merged over this file).

paths:
  runs_dir: runs
  judge_cache: runs/judge_cache.sqlite  # every VLM answer, keyed by model, prompt text and images
  catalogue: data/animals.json   # Chan's catalogue; see src/lenia/catalogue.py for the download

world:
  size: [128, 128]                     # torus, in cells
  R: 13                                # kernel radius for sampled rules (Orbium's)
  T: 10                                # steps per unit of time

horizon:
  time: 100                            # units of time per rollout (1,000 steps at T = 10); judged on the second half
  record_every: 0.5                    # statistics every this many units of time (kept in full: traces.npz)
  frames: 6                            # filmstrip frames, evenly over the last film_span
  film_span: 10
  stop_every: 10                       # drop clearly failed rollouts at these checkpoints (0 = never)
  spread_after: 20                     # ... counting 'spread' only from this time on
  thumb_every: 10                      # a 32x32 thumbnail of the world every this many units (0 = none)
  thumb_px: 32

alive:                                 # see src/lenia/alive.py for what each threshold does
  occupied: 0.1
  min_mass_r2: 0.02
  explode_occupancy: 0.5
  spread_occupancy: 0.15
  max_rg_r: 2.5
  dying_ratio: 0.5
  growing_ratio: 2.0
  max_growth: 0.15                     # still growing: fitted mass trend over the window > 15% of its mean (calibrated)
  max_rg_growth: 0.15                  # ... or spread (radius of gyration) trend > 15%
  min_body_r2: 0.05
  min_body_mass: 0.05
  min_speed_r: 0.02
  min_change: 0.05                     # below this a stationary pattern looks static (re-centring jitter)

sample:                                # see src/lenia/sample.py
  kernels: 3                           # multikernel
  channels: 3                          # multichannel
  self_k: 2                            # multichannel: kernels from each channel to itself
  cross_k: 1                           # multichannel: kernels from each channel to each other one

render:
  cmap: chan                           # chan | gray | magma (one channel); 2-3 channels map to RGB
  px: 96                               # tile size in the sheets
  crop_r: 3.0                          # crop around the creature, in kernel radii

run:
  backend: numpy                       # numpy | auto | cuda | mps | cpu (PyTorch); `lenia --backend auto` on Colab
  workers: 0                           # 0 = all cores but one (CPU); on a GPU always 1
  batch: 16                            # rollouts stepped together (CPU)
  batch_gpu: 64                        # ... on a GPU

judges:                                # VLM judges for `lenia vlmtest run` (keys in .env)
  defaults:
    max_workers: 8
    max_retries: 6
    timeout_s: 120
    budget_usd: 2.0                    # a run estimated above this stops and asks for --yes
  luna:
    backend: decisions                 # OpenRouter Decisions API: soft probabilities, deterministic
    model: openai/gpt-6-luna-decisions
    est_cost_per_call_usd: 0.0001      # vscene measured $0.00005 for two 512x320 images; ours are 648x648
  jev:
    backend: jev                       # TypeSafe System One; image input is experimental
    model: jev-latest                  # jev-preview = newest release
    est_cost_per_call_usd: 0.00001
    max_workers: 4
  fake:
    backend: fake                      # offline, for tests and dry runs
    fake_position_bias: 0.3
    fake_noise: 0.5

guided:                                # `lenia guided run | check | rate | gif`
  founders_from: explore-multikernel   # coherent creatures from the search with the resolution check
  lineages: 16
  generations: 50
  judge: luna                          # drives the search (best match to Felix's ratings with 'curate')
  heldout: jev                         # never sees the search; used by `check`
  prompt: curate
  threshold: 0.6                       # child replaces parent if P(child preferred), both orders averaged, >= this
  mut_scale: 1.0
  attempts: 3                          # mutants a lineage may try per generation until one passes the constraints
