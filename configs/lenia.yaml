# Settings read by the live pipeline. The classic-Lenia settings (horizon, alive thresholds, render crops,
# guided search) are in archive/configs/lenia_full.yaml.

judges:                                # judge backends (keys in .env); scripts pick one with --judge
  defaults:
    max_workers: 8
    max_retries: 6
    timeout_s: 120
    budget_usd: 2.0                    # a run estimated above this stops and asks for --yes
  luna:
    backend: decisions                 # OpenRouter Decisions API: soft probabilities, deterministic
    model: openai/gpt-6-luna-decisions
    est_cost_per_call_usd: 0.00011     # measured on MaCE duels (qd5-compare-s0)
  jev:
    backend: jev                       # TypeSafe System One; image input is experimental
    model: jev-1.14.0                  # pinned 2026-10-28 (was jev-latest, an alias that moves to each release);
                                       # scripts/pin_check.py confirms the name and the snapshot. Changing it
                                       # starts fresh caches (the model name is part of every cache key).
    est_cost_per_call_usd: 0.00011     # measured: ~2,640 input tokens per duel of two 644-px pictures
    max_workers: 4
  fake:
    backend: fake                      # offline, for tests and dry runs
    fake_position_bias: 0.3
    fake_noise: 0.5

vlms:                                  # generative VLMs (lenia.describe); scripts pick them with --models
                                       # IDs and prices checked 2026-10-29 against third-party listings: confirm with
                                       # `python3 scripts/bakeoff.py ping` before spending. Vertex prices are list prices
                                       # used for logging only; billing is Google's (and comes out of the project's credits).
  gemini-pro:
    backend: vertex                    # project: GOOGLE_CLOUD_PROJECT in .env; location: global
    model: gemini-4-argon              # newest Pro-class; fallback gemini-pro-3.1 below if not available on Vertex
    usd_per_m_input: 2.0               # introductory; $4 / $20 from 2026-12-01
    usd_per_m_output: 10.0             # thinking tokens bill as output
    thinking: {level: low}
    temperature: 1.0
    max_output_tokens: 4096
    est_cost_per_call_usd: 0.015     # measured 0.0128 per namer call (5 pictures), 10-29
    max_workers: 2                     # Vertex 429s (shared capacity for new models): fewer in parallel,
    max_retries: 8                     # and back off for up to ~6 minutes (10-29)
  gemini-pro-3.1:
    backend: vertex
    model: gemini-3.1-pro-preview
    usd_per_m_input: 2.0
    usd_per_m_output: 12.0
    thinking: {level: low}
    temperature: 1.0
    max_output_tokens: 4096
    est_cost_per_call_usd: 0.015     # assumed like gemini-pro
    max_workers: 2                     # Vertex 429s (shared capacity for new models): fewer in parallel,
    max_retries: 8                     # and back off for up to ~6 minutes (10-29)
  gemini-flash:
    backend: vertex
    model: gemini-3.8-flash
    usd_per_m_input: 0.75              # introductory; $1.50 / $7.50 from 2027-01-01
    usd_per_m_output: 3.75
    thinking: {level: low}
    temperature: 1.0
    max_output_tokens: 4096
    est_cost_per_call_usd: 0.006     # measured 0.0048 per namer call, 10-29
    max_workers: 2                     # Vertex 429s (shared capacity for new models): fewer in parallel,
    max_retries: 8                     # and back off for up to ~6 minutes (10-29)
  gemini-pro-or:                       # gemini-pro through OpenRouter: the fallback if Vertex is unavailable (the project
    backend: openrouter                # was flagged 10-29, reinstated 11-02); the same model, but its own cache entries
    model: google/gemini-4-argon       # confirm with `bakeoff.py ping --models gemini-pro-or` before spending
    usd_per_m_input: 2.0               # same as Vertex; $4 / $20 from 2026-12-01 (OpenRouter's usage report wins)
    usd_per_m_output: 10.0
    thinking: {effort: low}
    temperature: 1.0
    max_output_tokens: 4096
    est_cost_per_call_usd: 0.006       # assumed: one 644-px picture (a namer call with 5 was 0.0128)
    max_workers: 2
  qwen-8b:
    backend: openrouter                # cost comes from OpenRouter's usage report
    model: qwen/qwen3-vl-8b-instruct
    temperature: 0.7
    max_output_tokens: 1024
    est_cost_per_call_usd: 0.001     # measured 0.0006
  qwen-235b:
    backend: openrouter
    model: qwen/qwen3-vl-235b-a22b-instruct
    temperature: 0.7
    max_output_tokens: 1024
    est_cost_per_call_usd: 0.001     # measured 0.0006
  gemma-31b:
    backend: openrouter
    model: google/gemma-4-31b-it
    temperature: 0.7
    max_output_tokens: 1024
    est_cost_per_call_usd: 0.0005     # measured 0.0002
  fake:
    backend: fake
