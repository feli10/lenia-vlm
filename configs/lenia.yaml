# Settings read by the live pipeline. The classic-Lenia settings (horizon, alive thresholds, render crops,
# guided search) are in archive/configs/lenia_full.yaml.

judges:                                # judge backends (keys in .env); scripts pick one with --judge
  defaults:
    max_workers: 8
    max_retries: 6
    timeout_s: 120
    budget_usd: 2.0                    # a run estimated above this stops and asks for --yes
  luna:
    backend: decisions                 # OpenRouter Decisions API: soft probabilities, deterministic
    model: openai/gpt-6-luna-decisions
    est_cost_per_call_usd: 0.00011     # measured on MaCE duels (qd5-compare-s0)
  jev:
    backend: jev                       # TypeSafe System One; image input is experimental
    model: jev-latest                  # jev-preview = newest release
    est_cost_per_call_usd: 0.00011     # measured: ~2,640 input tokens per duel of two 644-px pictures
    max_workers: 4
  fake:
    backend: fake                      # offline, for tests and dry runs
    fake_position_bias: 0.3
    fake_noise: 0.5
